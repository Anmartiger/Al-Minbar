[package]
name = "al-minabr"
version = "0.1.0"
description = "Prayer times, Quran, athkar and qibla for the Linux desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "al_minabr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# §3: "Tray/panel: Tauri core tray-icon feature (TrayIconBuilder -> StatusNotifierItem)".
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vendored for a one-word visibility patch - see vendor/salah/PATCH.md
salah = { path = "vendor/salah" }
chrono = "0.4.45"
chrono-tz = "0.10.4"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
rodio = "0.21.1"
zbus = "5.12.0"
directories = "6.0.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
serde_json = "1"
