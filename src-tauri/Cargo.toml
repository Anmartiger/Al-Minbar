[package]
name = "al-minabr"
version = "0.1.0"
description = "Prayer times, Quran, athkar and qibla for the Linux desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "al_minabr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vendored for a one-word visibility patch - see vendor/salah/PATCH.md
salah = { path = "vendor/salah" }
chrono = "0.4.45"
chrono-tz = "0.10.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
serde_json = "1"
